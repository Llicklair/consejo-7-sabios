[project]
name = "consejo"
version = "0.1.0"
description = "El Consejo de los 7 Sabios — debate técnico estructurado entre 7 agentes con visiones opuestas."
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "rich-pixels>=3.0",
    "pillow>=10.0",
    "pygame>=2.5",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
agents = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
consejo = "consejo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consejo"]

[tool.ruff]
line-length = 100
target-version = "py311"
